# Replay retention probe (ADR-043, temporary): public (non-pro) matches of a given age -
# can OpenDota give a replay URL, and is the replay still on Valve's CDN? Only HEAD
# requests to the CDN; nothing is downloaded or stored. Match ids are anonymous pubs.
name: Replay age probe
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - run: |
          od=https://api.opendota.com/api
          # global match ids by age (from the pro probe): 3, 14, 28, 45, 60 days
          for pair in 3:9077861870 14:9062561406 28:9041352998 45:9015110394 60:8991215664; do
            age=${pair%%:*}; lt=${pair#*:}
            id=$(curl -sf "$od/publicMatches?less_than_match_id=$lt" | jq -r '.[0].match_id // empty')
            [ -n "$id" ] || { echo "age ${age}d: no public match"; continue; }
            url=$(curl -sf "$od/matches/$id" | jq -r '.replay_url // empty')
            how=cached
            if [ -z "$url" ]; then
              how=requested
              curl -sf -X POST "$od/request/$id" -o /dev/null || how=request-failed
              for i in $(seq 1 16); do
                sleep 15
                url=$(curl -sf "$od/matches/$id" | jq -r '.replay_url // empty')
                [ -n "$url" ] && break
              done
            fi
            code=none
            [ -n "$url" ] && code=$(curl -s -o /dev/null -I -w '%{http_code}' "$url")
            echo "PUB age ${age}d: match $id replay_url=$([ -n "$url" ] && echo yes || echo no) ($how) CDN HTTP $code"
            sleep 2
          done
