# Replay spike (ADR-043, temporary): can we get and parse a .dem in Actions?
#   1) OpenDota: the replay URL of a match (match_id, or the account's latest);
#      if it has none, ask OpenDota to parse it and wait;
#   2) download the .dem.bz2 from Valve, unpack;
#   3) parse it with OpenDota's own parser (odota/parser: Java + clarity), NDJSON out;
#   4) log COUNTS ONLY (sizes, timings, event types) - the repository is public.
# Nothing is stored. Remove after the decision.
name: Replay spike

on:
  workflow_dispatch:
    inputs:
      match_id:
        description: "Match ID (empty = a recent professional match: no personal data)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      parser:
        image: odota/parser
        ports:
          - 5600:5600
    steps:
      - name: Find the match and its replay URL (OpenDota)
        env:
          MATCH_ID: ${{ inputs.match_id }}
        run: |
          set -e
          od=https://api.opendota.com/api
          id="$MATCH_ID"
          if [ -z "$id" ]; then
            # a pro match 1-3 days old: parsed by OpenDota, still on Valve's CDN
            id=$(curl -sf "$od/proMatches" | jq -r --argjson now "$(date +%s)" '[.[] | select(.start_time < $now - 86400)][0].match_id')
          fi
          echo "match $id"
          echo "MATCH=$id" >> "$GITHUB_ENV"
          start=$(date +%s)
          url=$(curl -sf "$od/matches/$id" | jq -r '.replay_url // empty')
          if [ -z "$url" ]; then
            echo "no replay_url yet: requesting a parse"
            curl -sf -X POST "$od/request/$id" -o /dev/null || true
            for i in $(seq 1 40); do
              sleep 30
              url=$(curl -sf "$od/matches/$id" | jq -r '.replay_url // empty')
              [ -n "$url" ] && break
            done
          fi
          [ -n "$url" ] || { echo "RESULT: no replay URL after waiting"; exit 1; }
          echo "::add-mask::$url"
          echo "URL=$url" >> "$GITHUB_ENV"
          echo "replay url after $(( $(date +%s) - start )) s; host: $(echo "$url" | sed -E 's#^https?://([^/]+)/.*#\1#')"
      - name: Download and unpack
        run: |
          set -e
          start=$(date +%s)
          code=$(curl -s -o r.dem.bz2 -w '%{http_code}' "$URL")
          echo "download HTTP $code, $(stat -c%s r.dem.bz2 2>/dev/null || echo 0) bytes, $(( $(date +%s) - start )) s"
          [ "$code" = "200" ] || { echo "RESULT: replay not downloadable (expired or not on the CDN)"; exit 1; }
          echo "url ends with: $(echo "$URL" | sed -E 's#.*(\.[a-z0-9]+(\.[a-z0-9]+)?)$#\1#')"
          echo "file type: $(file -b r.dem.bz2 | cut -c1-80); magic: $(head -c 8 r.dem.bz2 | od -An -c | tr -s ' ')"
          start=$(date +%s)
          case "$(file -b r.dem.bz2)" in
            bzip2*) bunzip2 r.dem.bz2 ;;
            Zstandard*) zstd -q -d r.dem.bz2 -o r.dem && rm r.dem.bz2 ;;
            *) mv r.dem.bz2 r.dem ;;
          esac
          echo "unpacked $(stat -c%s r.dem) bytes in $(( $(date +%s) - start )) s; header: $(head -c 8 r.dem | tr -dc 'A-Z0-9')"
      - name: Parse with odota/parser
        run: |
          set -e
          for i in $(seq 1 30); do curl -s localhost:5600 >/dev/null && break; sleep 2; done
          start=$(date +%s)
          curl -s --max-time 900 localhost:5600 --data-binary "@r.dem" -o out.ndjson
          echo "parsed in $(( $(date +%s) - start )) s, $(wc -l < out.ndjson) lines, $(stat -c%s out.ndjson) bytes"
          echo "event types (count):"
          jq -r '.type' out.ndjson | sort | uniq -c | sort -rn > types.txt; head -12 types.txt
          echo "interval events per hero slot:"
          jq -r 'select(.type=="interval") | .slot' out.ndjson | sort -n | uniq -c | wc -l
          echo "interval fields at 10:00 (union):"
          jq -c 'select(.type=="interval" and .time==600) | keys' out.ndjson | sort -u
          echo "x/y present in interval events after 0:00: $(jq -r 'select(.type=="interval" and .time>0 and .x!=null) | .slot' out.ndjson | wc -l)"
          echo "sample position precision (slot 0, 600..603 s): $(jq -c 'select(.type=="interval" and .slot==0 and .time>=600 and .time<=603) | [.time,.x,.y]' out.ndjson | tr '\n' ' ')"
          echo "disabling modifiers on heroes (top 15 by count):"
          jq -r 'select(.type=="DOTA_COMBATLOG_MODIFIER_ADD" and .targethero==true) | .inflictor' out.ndjson | grep -Ei "stun|hex|silence|root|sleep|taunt|fear|cyclone|bash|disarm" | sort | uniq -c | sort -rn | head -15
          echo "gold reasons: $(jq -c 'select(.type=="DOTA_COMBATLOG_GOLD") | keys' out.ndjson | sort -u | head -2)"
          echo "time span of interval events:"
          jq -r 'select(.type=="interval") | .time' out.ndjson | sort -n > t.txt; sed -n '1p;$p' t.txt
          echo "combat log types (DOTA_COMBATLOG_*):"
          echo "(see above)"
          echo "modifier fields:"
          jq -c 'select(.type=="DOTA_COMBATLOG_MODIFIER_ADD") | keys' out.ndjson | sort -u | head -2
