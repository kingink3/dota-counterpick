# STRATZ statistics by rank bracket and position (ADR-027). Needs the repository
# secret STRATZ_TOKEN (Settings -> Secrets and variables -> Actions).
# Raw responses accumulate on the `stratz-raw` branch, one folder per dataset
# (scripts/stratz/<dataset>.json, made by scripts/build-stratz-queries.ts).
# STRATZ allows 2 IP addresses per 15 minutes and every run has a new IP:
# at most 2 runs per 15 minutes.
name: Fetch STRATZ stats

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "schema or fetch"
        required: true
        default: fetch
      dataset:
        description: "scripts/stratz/<dataset>.json (fetch mode)"
        required: false
        default: items

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Query STRATZ
        env:
          STRATZ_TOKEN: ${{ secrets.STRATZ_TOKEN }}
        run: |
          if [ "${{ inputs.mode }}" = "schema" ]; then
            npx tsx scripts/stratz-fetch.ts --mode schema --out /tmp/stratz/schema
          else
            npx tsx scripts/stratz-fetch.ts --mode fetch --spec "scripts/stratz/${{ inputs.dataset }}.json" --out "/tmp/stratz/${{ inputs.dataset }}"
          fi
      - name: Add to the stratz-raw branch
        if: always()
        run: |
          set -e
          name="${{ inputs.mode == 'schema' && 'schema' || inputs.dataset }}"
          [ -d "/tmp/stratz/$name" ] || exit 0
          url="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git clone -q --depth 1 --branch stratz-raw --single-branch "$url" /tmp/raw || {
            mkdir -p /tmp/raw && cd /tmp/raw && git init -q -b stratz-raw && git remote add origin "$url"; }
          cd /tmp/raw
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf "$name" && cp -r "/tmp/stratz/$name" "$name"
          date -u +%Y-%m-%dT%H:%MZ > "$name/fetched-at.txt"
          git add -A
          git commit -q -m "STRATZ raw: $name $(cat "$name/fetched-at.txt")"
          git push -q origin stratz-raw
