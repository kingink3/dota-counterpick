# Build the encrypted site and publish it to GitHub Pages (ADR-019).
# Needs the repo secret APP_PASSWORD (Settings -> Secrets and variables -> Actions)
# and Settings -> Pages -> Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:pages
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          # optional (ADR-044): fine-grained token, this repo only, Actions read & write
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
