# temporary (ADR-047): is the Supabase project set up as expected? No users are created.
name: Supabase probe
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U=https://mtpmxxzhyqwwbomadsjv.supabase.co
          K=sb_publishable_6ZSwsdqWSFbe9UvOZdPQCA_vYaJ5w67
          echo "auth settings: $(curl -s "$U/auth/v1/settings" -H "apikey: $K" | jq -c '{email: .external.email, autoconfirm: .mailer_autoconfirm, signup_disabled: .disable_signup}')"
          echo "anon read of school_progress (must be refused): HTTP $(curl -s -o r.json -w '%{http_code}' "$U/rest/v1/school_progress?select=user_id" -H "apikey: $K") $(head -c 200 r.json)"
          echo "anon insert (must be refused): HTTP $(curl -s -o w.json -w '%{http_code}' -X POST "$U/rest/v1/school_progress" -H "apikey: $K" -H 'content-type: application/json' -d '{"user_id":"00000000-0000-0000-0000-000000000000","data":{}}') $(head -c 200 w.json)"
          echo "CORS preflight from the site:"
          curl -s -o /dev/null -D - -X OPTIONS "$U/rest/v1/school_progress" -H "Origin: https://kingink3.github.io" -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: apikey,authorization,content-type,prefer" | grep -i "^access-control-allow-\(origin\|headers\|methods\)"
          echo "auth CORS:"; curl -s -o /dev/null -D - -X OPTIONS "$U/auth/v1/token?grant_type=password" -H "Origin: https://kingink3.github.io" -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: apikey,content-type" | grep -i "^access-control-allow-origin"
