# Review a match (ADR-031, ADR-042, ADR-044, ADR-053): builds matches with every player from
# their replays (OpenDota -> Valve -> odota/parser), STRATZ only where that fails, and adds
# them, encrypted with the site password (APP_PASSWORD), to the `review-data` branch.
# The site (Review) lists and opens them.
#   - "Check for new matches" (auto): matches of your last-20 list not stored yet, newest
#     first, at most 5, from their replays only (no STRATZ); with nothing new it stops after
#     one OpenDota call;
#   - a match ("Review" / "Try STRATZ" on the page, ADR-044/058): match_sealed = its id sealed
#     with the site password, so the id is not public; by hand: match_id;
#   - list_only = only refresh the list.
#   The list of your matches comes from OpenDota; the STRATZ token is still read for your
#   Steam id (no call) and used when a replay is missing or fails.
# Note: in a public repository the runs and their inputs are public: the page seals the id.
# STRATZ allows 2 IP addresses per 15 minutes; STRATZ runs share one queue.
name: Review a match

# only on demand (the page's buttons, or by hand): no schedule
on:
  workflow_dispatch:
    inputs:
      match_id:
        description: "Match ID (empty = your latest match)"
        required: false
        default: ""
      match_sealed:
        description: "Set by the page: the match id sealed with the site password (not public)"
        required: false
        default: ""
      list_only:
        description: "Only refresh the list of my recent matches"
        type: boolean
        required: false
        default: false
      auto:
        description: "Check for new: my listed matches not stored yet"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

# its own queue (every 5 min would starve the STRATZ stats workflow); the STRATZ fallback
# below still waits for a free STRATZ slot by itself
concurrency:
  group: review
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Open the encrypted store (review-data branch)
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          set -e
          url="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git clone -q --depth 1 --branch review-data --single-branch "$url" /tmp/store || {
            mkdir -p /tmp/store && cd /tmp/store && git init -q -b review-data && git remote add origin "$url"; cd -; }
          npx tsx scripts/review-store.ts --dir /tmp/store --ids /tmp/stored-ids.json --missed /tmp/missed.json --prev /tmp/prev-recent.json
      - name: Open the sealed match id (masked)
        if: ${{ inputs.match_sealed != '' }}
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          SEALED: ${{ inputs.match_sealed }}
        run: npx tsx scripts/open-input.ts MATCH_ID
      - name: Anything to do? ("check for new")
        id: plan
        if: ${{ inputs.auto == true }}
        env:
          STRATZ_TOKEN: ${{ secrets.STRATZ_TOKEN }}
        run: npx tsx scripts/replay-review.ts --mode auto --plan --skip /tmp/stored-ids.json --missed /tmp/missed.json --prev /tmp/prev-recent.json --max 5 --out /tmp/plan
      - uses: actions/setup-java@v4
        if: ${{ inputs.list_only != true && steps.plan.outputs.work != 'false' }}
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build our replay extractor (clarity, ADR-055; optional)
        if: ${{ inputs.list_only != true && steps.plan.outputs.work != 'false' }}
        working-directory: tools/clarity
        run: mvn -q -B compile dependency:copy-dependencies || echo "extractor not built - reviews go without HP / items"
      - name: Start the replay parser (odota/parser)
        if: ${{ inputs.list_only != true && steps.plan.outputs.work != 'false' }}
        run: |
          docker run -d --name parser -p 5600:5600 odota/parser >/dev/null
          for i in $(seq 1 60); do curl -s -o /dev/null localhost:5600 && break; sleep 2; done
      - name: Matches from their replays (ADR-053)
        if: ${{ steps.plan.outputs.store != 'false' }}
        env:
          STRATZ_TOKEN: ${{ secrets.STRATZ_TOKEN }}
          MATCH_ID_IN: ${{ inputs.match_id }}
          LIST_ONLY: ${{ inputs.list_only }}
          EVENT: ${{ github.event_name }}
          AUTO: ${{ inputs.auto }}
        run: |
          mkdir -p /tmp/match
          if [ "$AUTO" = "true" ]; then
            npx tsx scripts/replay-review.ts --mode auto --skip /tmp/stored-ids.json --missed /tmp/missed.json --max 5 --out /tmp/match
          elif [ "$LIST_ONLY" = "true" ]; then
            npx tsx scripts/replay-review.ts --mode recent --missed /tmp/missed.json --out /tmp/match
          else
            npx tsx scripts/replay-review.ts --mode match --match "${MATCH_ID:-$MATCH_ID_IN}" --missed /tmp/missed.json --out /tmp/match
          fi
      - name: STRATZ for what the replays could not do (fallback; not for "check for new")
        if: ${{ inputs.auto != true }}
        env:
          STRATZ_TOKEN: ${{ secrets.STRATZ_TOKEN }}
          EVENT: ${{ github.event_name }}
          AUTO: ${{ inputs.auto }}
        run: |
          todo=/tmp/match/stratz-todo.json
          [ -f "$todo" ] || { echo "replay step gave no plan: STRATZ does it all"; echo '{"ids":[],"latest":true,"recent":true}' > "$todo"; }
          ids=$(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).ids.join(" "))' "$todo")
          latest=$(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).latest)' "$todo")
          recent=$(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).recent)' "$todo")
          rflag="--recent no"; [ "$recent" = "true" ] && rflag=""
          if [ "$latest" = "true" ]; then
            if [ "$EVENT" = "schedule" ] || [ "$AUTO" = "true" ]; then
              npx tsx scripts/stratz-fetch.ts --mode auto --skip /tmp/stored-ids.json --max 3 --out /tmp/match
            else
              npx tsx scripts/stratz-fetch.ts --mode match --out /tmp/match $rflag
            fi
            rflag="--recent no"
          fi
          for id in $ids; do
            npx tsx scripts/stratz-fetch.ts --mode match --match "$id" --name "match-$id.json" --out /tmp/match $rflag || echo "a match failed on STRATZ too"
            rflag="--recent no"
          done
          if [ "$recent" = "true" ] && [ "$rflag" = "" ]; then npx tsx scripts/stratz-fetch.ts --mode recent --out /tmp/match; fi
      - name: Replays for the STRATZ matches (optional - ADR-045)
        if: ${{ inputs.list_only != true && steps.plan.outputs.work != 'false' }}
        run: |
          ls /tmp/match/match*.json >/dev/null 2>&1 && npx tsx scripts/replay-fetch.ts --dir /tmp/match || echo "no matches to add"
          docker rm -f parser >/dev/null || true
      - name: Add to the encrypted store
        if: ${{ steps.plan.outputs.store != 'false' }}
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          set -e
          npx tsx scripts/review-store.ts --in-dir /tmp/match --recent /tmp/match/recent.json --dir /tmp/store
          cd /tmp/store
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # one commit, no history: the branch holds the newest matches only
          git checkout -q --orphan fresh
          git add -A
          git commit -q -m "review-data $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "nothing new"; exit 0; }
          git push -q -f origin fresh:review-data
