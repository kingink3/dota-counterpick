# temporary (ADR-054 check): OpenDota Explorer from Actions - supports and core items,
# matched on game state. Aggregates only in the log. Delete after ADR-054.
name: Explorer probe
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsx scripts/explorer-probe.ts --days 120
