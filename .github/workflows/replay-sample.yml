# temporary (ADR-055): our clarity processor on one public pro match (no personal data).
name: Clarity probe
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17, cache: maven }
      - name: clarity versions
        run: curl -s https://repo1.maven.org/maven2/com/skadistats/clarity/maven-metadata.xml | grep -E "release|latest|<version>" | tail -8
      - name: Build
        working-directory: tools/clarity
        run: |
          ver=$(curl -s https://repo1.maven.org/maven2/com/skadistats/clarity/maven-metadata.xml | grep -oP '(?<=<release>)[^<]+')
          echo "clarity $ver"
          mvn -q -B -Dclarity.version=$ver compile dependency:copy-dependencies
      - name: Replay
        run: |
          url=$(curl -sf https://api.opendota.com/api/matches/9081380063 | jq -r .replay_url)
          curl -s -o r.pack "$url"; zstd -q -d r.pack -o r.dem; ls -la r.dem
      - name: Probe
        working-directory: tools/clarity
        run: java -cp "target/classes:target/dependency/*" app.Probe ../../r.dem 2>&1 | head -400
