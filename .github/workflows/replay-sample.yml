# temporary (ADR-055): our clarity processor on one public pro match (no personal data).
name: Clarity probe
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: maven }
      - name: clarity versions
        run: curl -s https://repo1.maven.org/maven2/com/skadistats/clarity/maven-metadata.xml | grep -E "release|latest|<version>" | tail -8
      - name: Build
        working-directory: tools/clarity
        run: |
          ver=$(curl -s https://repo1.maven.org/maven2/com/skadistats/clarity/maven-metadata.xml | grep -oP '(?<=<release>)[^<]+')
          echo "clarity $ver"
          mvn -q -B -Dclarity.version=$ver compile dependency:copy-dependencies
      - name: Replay
        run: |
          for i in 1 2 3 4 5 6; do url=$(curl -sf https://api.opendota.com/api/matches/9081380063 | jq -r .replay_url) && [ -n "$url" ] && break; sleep 20; done
          curl -s -o r.pack "$url"; zstd -q -d r.pack -o r.dem; ls -la r.dem
      - name: Probe
        working-directory: tools/clarity
        run: java -cp "target/classes:target/dependency/*" app.Probe ../../r.dem 2>&1 | grep -v SLF4J | head -300
      - name: Extract
        working-directory: tools/clarity
        run: |
          time java -cp "target/classes:target/dependency/*" app.Extract ../../r.dem > ../../extract.ndjson
          wc -l ../../extract.ndjson; ls -la ../../extract.ndjson
          grep '"t":968,' ../../extract.ndjson | head -3
          grep '"t":-60,' ../../extract.ndjson | head -1
          gzip -c ../../extract.ndjson > ../../extract.ndjson.gz
      - name: Push the extract to the dev-sample branch (public pro match)
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mv extract.ndjson.gz /tmp/x.gz; rm -f extract.ndjson r.pack r.dem
          git fetch -q origin dev-sample && git checkout -q -B dev-sample origin/dev-sample
          cp /tmp/x.gz extract.ndjson.gz
          git add -f extract.ndjson.gz && git commit -q -m "clarity extract sample" && git push -q origin dev-sample
