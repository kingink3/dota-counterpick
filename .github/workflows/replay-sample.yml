# temporary (ADR-057): fit STRATZ's lane outcome on public ranked matches. Aggregates only.
name: Lane outcome fit
on: { workflow_dispatch: {} }
permissions: { contents: read }
concurrency: { group: stratz, cancel-in-progress: false }
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - env: { STRATZ_TOKEN: "${{ secrets.STRATZ_TOKEN }}" }
        run: npx tsx scripts/lane-fit.ts 700
