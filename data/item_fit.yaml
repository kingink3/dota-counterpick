# =============================================================================
#  Item fit - does an item belong in THIS hero's build? (ADR-018)
# =============================================================================
#  The counter layers (items.yaml tags, item_edges, defense.yaml) answer "what
#  beats the enemy draft". They say nothing about whether the item suits the hero
#  you play: Eul's Scepter really does cancel Axe's Call, but a carry Sniper does
#  not build it. This file is that missing axis, as a score multiplier per hero
#  ARCHETYPE (curated expert estimate - calibrate like the edge weights):
#
#      1.0  core / standard item for the archetype
#      0.6  situational
#      0.25 off-build (shown last, flagged in the UI)
#
#  Archetype of the hero you play (resolver.archetypeOf):
#    - your selected position wins: 1 carry, 2 by hero (see below), 3 offlane, 4/5 support
#    - else the hero's first position in taxonomy hero_tags:
#        1 -> carry, 3 -> offlane, 4/5 -> support,
#        2 -> carry if attack_reliant >= 0.6 (right-click mid) else caster
#    - archetype_override below fixes the heroes this heuristic gets wrong
#  Attack type (melee / ranged) comes from data/roster.json (OpenDota attack_type).
#  Items with `melee_only` / `ranged_only` are capped at `wrong_attack` for the other type.
#
#  An item missing from `fit` is neutral (x1) - test/engine.test.ts checks that every
#  item the engine can recommend is listed.
# =============================================================================

wrong_attack: 0.25

archetype_override:
  huskar: carry          # right-click (Armlet / Heaven's Halberd / Satanic), not a caster
  dragon_knight: carry   # right-click tank-carry
  ember_spirit: carry    # Maelstrom / Battle Fury / Daedalus mid
  kunkka: offlane        # utility core, not a caster

# wiki slugs that duplicate catalog ids (merged before scoring)
alias:
  battle_fury: battlefury
  orchid_malevolence: orchid
  shiva_s_guard: shivas_guard

