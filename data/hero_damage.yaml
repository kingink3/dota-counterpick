# =============================================================================
#  What each hero DEALS (ADR-059): shares of its damage to heroes by school,
#  [physical, magic, pure], summing to 1.
#
#  Separate from the reliance tags on purpose: `attack_reliant` / `spell_reliant`
#  say what switches a hero off (disarm, silence), not which school its damage is.
#  Dazzle is spell-reliant and deals physical damage; Timbersaw is spell-reliant and
#  deals pure; Spectre is not attack-reliant in the KB and still hits for physical.
#
#  HOW MUCH and WHEN comes from data, not from here: data/benchmarks.json has the
#  hero damage per minute by hero and position for our bracket; the engine multiplies
#  the two (src/resolver.ts damageProfile).
#
#  Honesty flag: the shares are an expert estimate for a typical build in a typical
#  game (attacks + spells + the usual damage items), rounded to 0.05. They are not
#  measured. Reviewed for 7.41; re-check a hero when its abilities change
#  (PATCH_RUNBOOK B5). "# ?" marks a share the author is not sure of.
# =============================================================================

