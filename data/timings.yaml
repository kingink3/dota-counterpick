  - id: lotus
    label: "Healing Lotus (+1 per pool)"
    first: 180
    every: 180
    roles: [3, 4, 5]
    lead: 15
    note: "pools hold up to 6; Great Lotuses after Tier 4 neutrals, Greater after Tier 5"
    source: "7.33: every 3 minutes each pool spawns 1 Healing Lotus, up to 6; 7.38: Great/Greater Lotus after T4/T5"

  - id: stack
    label: "Stack window"
    first: 53
    every: 60
    window: 3
    roles: [4, 5]
    lead: 8
    confidence: rule
    note: "pull the camp at about :53-:55 so it is out of the spawn box at :00"
    source: "neutral camps respawn every minute on the minute (game rule)"

  - id: pull
    label: "Lane pull"
    first: 15
    every: 30
    until: 600
    roles: [4, 5]
    lead: 5
    confidence: approx
    note: "about :15 / :45 for the small camp - adjust per camp (7.39 shortened flooded-camp pulls)"
    source: "lane creep waves every 30 s (game rule); pull timing practice"

  - id: night
    label: "Night falls"
    first: 300
    every: 600
    roles: [1, 2, 3, 4, 5]
    lead: 20
    confidence: rule
    note: "5 min day / 5 min night; Roshan crosses the river at each change after 15:00, Tormentor follows the cycle"
    source: "day/night 5+5 min (game rule; observed: 36:15 shows night); 7.38 Roshan/Tormentor follow the cycle"

  - id: day
    label: "Day breaks"
    first: 600
    every: 600
    roles: [1, 2, 3, 4, 5]
    lead: 20
    confidence: rule
    source: "day/night 5+5 min (game rule)"

  - id: tormentor
    label: "Tormentor"
    at: [1200]
    roles: [1, 2, 3, 4, 5]
    lead: 60
    note: "one Tormentor at a time; Radiant side at night, Dire side at day"
    source: "7.39: first spawn increased from 15:00 to 20:00; 7.38: single Tormentor, follows day/night"

  - id: tormentor_respawn
    label: "Tormentor back"
    after: tormentor_killed
    delay: 600
    roles: [1, 2, 3, 4, 5]
    lead: 60
    source: "7.33: Tormentors respawn 10 minutes after their defeat"

  - id: roshan_window
    label: "Roshan may be up"
