    delay: 480
    window: 180
    roles: [1, 2, 3, 4, 5]
    lead: 60
    note: "respawns 8-11 minutes after death"
    source: "7.38: Roshan's respawn takes between 8 to 11 minutes"

  - id: neutral_tier
    label: "Neutral tier"
    at: [900, 1500, 2100, 3600]
    names: ["Tier 2 neutrals", "Tier 3 neutrals", "Tier 4 neutrals", "Tier 5 neutrals"]
    roles: [1, 2, 3, 4, 5]
    lead: 30
    note: "Tier 1 from 0:00 (7.41); each tier needs 10 Madstone"
    source: "7.38: Madstone cap 15/25/35/45 at 15:00/25:00/35:00/60:00 (enough for T2..T5); 7.41: T1 from 0:00"
