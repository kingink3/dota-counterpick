# =============================================================================
#  Timed map events for the Game tab (ADR-026). One line per event, each with its
#  source. Primary source: Valve patch notes (dotaconstants patchnotes.json);
#  `confidence: rule` = a long-standing game rule not restated in recent notes;
#  `confidence: approx` = a practical window (pull timing depends on the camp).
#  Review every patch (PATCH_RUNBOOK B: "timings").
#
#  Times are game seconds (0 = horn). Schedule kinds:
#    every:   first + n * every  (until `until`, if set)
#    at:      fixed list
#    after:   N seconds after a manually reported moment (Roshan / Tormentor killed)
#  roles: positions that see the reminder (1..5). lead: seconds of warning.
# =============================================================================

patch: "7.41"
reviewed: 2026-11-04

events:
  - id: bounty_rune
    label: "Bounty runes"
    first: 0
    every: 240
    roles: [1, 2, 3, 4, 5]
    lead: 20
    source: "7.29: 4 runes at 0:00; 7.38: interval increased from 3 to 4 minutes"

  - id: water_rune
    label: "Water runes (both power spots)"
    at: [120, 240]
    roles: [2, 4]
    lead: 15
    source: "7.29: spawn only at minute 2 and 4 at both power rune spots"

  - id: power_rune
    label: "Power rune"
    first: 360
    every: 120
    roles: [2, 4]
    lead: 15
    source: "7.29: starting at 6 minutes power runes spawn as usual (every 2 minutes)"

  - id: wisdom_shrine
    label: "Wisdom Shrines (offlane jungle)"
    first: 420
    every: 420
    roles: [3, 4, 5]
    lead: 30
    note: "first 200 XP, then +300 each (200/500/800...); the countdown runs back while an enemy hero stands in it"
