# -----------------------------------------------------------------------------
#  SPECIAL CASES - traps where naive tag->tag lies. Encoded as guards.
# -----------------------------------------------------------------------------
special_cases:

  - id: backtrack_is_not_evasion
    trap: >
      Backtrack (Faceless Void) is a DODGE, not miss chance. true_strike (MKB)
      does NOT pierce it. You cannot tag Void with evasion.
    encoding: >
      A separate reliance tag dodge_backtrack, answered_by [break, lockdown,
      burst_through]. The true_strike tool does NOT apply to it.
    affected_heroes: [faceless_void]

  - id: tanky_summons_not_clearable
    trap: >
      AoE clear kills FRAGILE summons (eidolons, treants, spiderlings,
      familiars). BUT Spirit Bear (Lone Druid), Golem (Warlock), Tombstone
      zombies have real HP and are NOT cleared like illusions. Do not tag them
      summon_clearable.
    encoding: >
      summon_clearable is fragile-only. Tanky summons = a separate tag
      summon_tanky (answered_by: focus_summon / break / lockdown the owner).
    affected_heroes: [lone_druid, warlock]

  - id: bkb_guard_on_disable_rules
    trap: >
      The rule "interrupt/lockdown counters channeling/mobility" is false if the
      target pops BKB and the tool is magical and does not pierce immunity.
    encoding: >
      Every rule with a tool in [interrupt, lockdown_root, magic_burst, silence]
      carries condition: { unless_target_tag: bkb_reliant, or_tool_tag: bkb_piercing_disable }
    note: >
      bkb_reliant is a flag tag (not a counter-pick axis), put on heroes that
      regularly buy BKB. Used ONLY in guards, never as a recommendation target.

  - id: shadow_dance_is_not_invisibility
    trap: >
      Shadow Dance (Slark) makes him HIDDEN, not invisible: he cannot be seen or
      targeted even with True Sight. Sentry / Dust / Gem do nothing against it, so
      tagging Slark relies_on_invisibility makes the detection edge recommend
      useless items.
    encoding: >
      Slark carries NO relies_on_invisibility. A shadow_dance tag would have a
      single carrier (ADR-008 -> hero rule, not a tag), so the real answers are
      point enrichment in data/item_edges.yaml (Orchid / Bloodthorn: silence stops
      the Dance from being cast) plus the wiki hero edges (vision-based answers).
    affected_heroes: [slark]

# -----------------------------------------------------------------------------
#  EDGES - canonical tool->reliance rules (the base). hero->hero rules are
#          written SEPARATELY as point enrichment on top of this basis.
# -----------------------------------------------------------------------------
edges:
  - tool: detection
    target: relies_on_invisibility
    mechanism: "detection strips invis - breaks initiation/escape"
    weight: 1.3
  - tool: mana_burn
    target: mana_dependent
    mechanism: "draining mana shuts off abilities/shield"
    weight: 1.2
  - tool: aoe_clear
    target: illusion_based
    mechanism: "AoE clears illusions, exposing the real hero"
    weight: 1.2
  - tool: aoe_clear
    target: summon_clearable
    mechanism: "AoE wipes fragile summons"
    weight: 1.0
  - tool: true_strike
    target: evasion
    mechanism: "a guaranteed hit ignores miss chance"
    weight: 1.3
    conditions: { exclude_target_tag: dodge_backtrack }   # see special_cases
  - tool: healing_reduction
    target: sustain_dependent
    mechanism: "cutting healing collapses survivability"
    weight: 1.3
  - tool: interrupt
    target: channeling_ultimate
    mechanism: "the interrupt cancels the channel before the effect"
    weight: 1.4
    conditions: { unless_target_tag: bkb_reliant, or_tool_tag: bkb_piercing_disable }
  - tool: lockdown_root
    target: mobility_dependent
    mechanism: "root cancels the blink-escape and pins for focus"
    weight: 1.2
    conditions: { unless_target_tag: bkb_reliant, or_tool_tag: bkb_piercing_disable }
  - tool: armor_reduction
    target: low_armor
    mechanism: "minus armor multiplies physical damage"
    weight: 1.0
  - tool: magic_damage
    target: high_armor
    mechanism: "magic damage (Brooch turns right-clicks magical) ignores their armor entirely"
    weight: 1.2
  - tool: armor_reduction
    target: high_armor
    mechanism: "strip the armor (Deso/AC/Solar/Slardar) so physical damage lands again"
    weight: 0.9
  - tool: magic_burst
    target: high_armor
    mechanism: "magic combo ignores armor - armor stacking does nothing against it"
    weight: 0.8
    conditions: { unless_target_tag: bkb_reliant }
  - tool: magic_burst
    target: magic_burst_vulnerable
    mechanism: "the magic combo kills before the target acts"
    weight: 1.1
    conditions: { unless_target_tag: bkb_reliant }
  - tool: silence
    target: spell_reliant
    mechanism: "silence shuts the hero off as a fighting unit"
    weight: 1.1
    conditions: { unless_target_tag: bkb_reliant, or_tool_tag: bkb_piercing_disable }

  # --- core-axis edges ---
  - tool: disarm
    target: attack_reliant
    mechanism: "disarm cancels auto-attacks - zeroes a right-clicker's DPS"
    weight: 1.3
    conditions: { unless_target_tag: bkb_reliant }   # Halberd is removed by BKB
  - tool: break
    target: attack_reliant
    mechanism: "break disables the steroid passive (Coup/Bash/Fury)"
    weight: 0.9
  - tool: break
    target: dodge_backtrack
    mechanism: "break disables the Backtrack passive - the dodge is gone, the target takes damage again"
    weight: 1.0
  - tool: break
    target: key_passive
    mechanism: "break disables the defining passive (Reactive Armor/Warpath/Dispersion) - the hero's whole kit collapses"
    weight: 1.1
  - tool: kite
    target: melee_commit
    mechanism: "force/slow/mobility deny a melee its damage"
    weight: 1.0
  - tool: kite
    target: low_mobility
    mechanism: "a slow, escape-less target gets kited and focused"
    weight: 0.8
  - tool: physical_burst
    target: squishy_to_burst
    mechanism: "physical burst kills a fragile target before it acts"
    weight: 1.0
  - tool: focus_summon
    target: summon_tanky
    mechanism: "the tanky summon is focus-fired - but NOT AoE-cleared"
    weight: 0.7
  # --- v0.8 (howdoiplay review, 2026-11-04): mechanics missing from the vocabulary ---
  - tool: purge
    target: dispellable_buffs
    mechanism: "a purge strips the buff the hero is built around (shield, haste, evasion, attack-speed stacks)"
    weight: 1.0
  - tool: illusion_execute
    target: illusion_based
    mechanism: "one cast deletes an illusion outright - the army thins and the real hero is found"
    weight: 0.7
  - tool: creep_execute
    target: summon_clearable
    mechanism: "creeps and summons are eaten or killed in one cast - the summoner's army never snowballs"
    weight: 0.6
  - tool: ally_save
    target: pickoff_reliant
    mechanism: "a save at the last moment wastes the whole kill window (and a long cooldown)"
    weight: 0.9
  - tool: armor_reduction
    target: summon_tanky
    mechanism: "minus armor is the cheapest way to kill an armored summon (Spirit Bear, Golem)"
    weight: 0.5

  # --- v0.2: BKB-piercing control as a standalone counter-tool ---
  #     bkb_piercing_disable used to live ONLY in guards (or_tool_tag). But hard
  #     CC through immunity IS the universal answer to mobility and channeling
  #     even under BKB. These edges carry NO bkb guard: they pierce by definition.
  - tool: bkb_piercing_disable
    target: mobility_dependent
    mechanism: "a lock through BKB (Doom/Chrono/Roar/Ensnare) pins the blink-escaper even if it goes immune"
    weight: 1.1
  - tool: bkb_piercing_disable
    target: channeling_ultimate
    mechanism: "an interrupt through BKB cancels the channel even if the caster pops immunity under it"
    weight: 1.3

  # --- v0.2: filling answered_by entries that had no edge ---
  - tool: physical_burst
    target: low_armor
    mechanism: "low-armor targets evaporate to physical burst even without minus armor"
    weight: 0.9
  - tool: magic_burst
    target: squishy_to_burst
    mechanism: "a magic combo deletes any low effective-HP target before it acts (not only low-MR ones)"
    weight: 0.9
    conditions: { unless_target_tag: bkb_reliant }
  - tool: break
    target: evasion
    mechanism: "break removes PASSIVE evasion (Blur/Drunken Brawler) - miss chance disappears without MKB"
    weight: 0.8

  # --- v0.2: pickoff as a working strategic answer (it has carriers) ---
  #     pickoff is carried by Pudge/Spectre/Bloodseeker/Bounty - removing singles.
  - tool: pickoff
    target: squishy_to_burst
    mechanism: "a pickoff cuts a fragile target out of the lineup before the fight"
    weight: 0.8
  - tool: pickoff
    target: low_mobility
    mechanism: "an escape-less, slow target gets caught on rotations and removed alone"
    weight: 0.8
  - tool: pickoff
    target: greedy_farmer
    mechanism: "deny the greedy carry farm space - pressure with pickoffs at the right timing"
    weight: 0.7

# -----------------------------------------------------------------------------
#  resistance / resist_edges - the THIRD axis (ADR-020): what a hero ENDURES.
#  edges answer "my tool hits your weakness"; resist_edges answer "your threat
#  barely works on me". Used both ways by the resolver:
#    resilience  : candidate resistance  x  enemy tool/reliance   (+)
#    blunted     : candidate tool        x  enemy resistance      (-)
#  An edge names exactly one of `tool` (enemy tool tag) or `reliance` (enemy
#  damage source, e.g. attack_reliant = their damage is right-clicks).
#  pierced_by: attacker tools that bypass the resistance - no credit for it vs
#  an enemy carrying one, and no "blunted" penalty for a candidate carrying one.
#  Weights are expert estimates; physical/magic burst rows are deliberately low.
# -----------------------------------------------------------------------------
resistance:
  - code: mana_shield
    label: "Mana Shield"
    hook: "Damage is paid with mana - a small HP pool that health-based damage cannot exploit (Medusa)"
    pierced_by: [mana_burn]
  - code: self_debuff_immunity
    label: "Own debuff immunity"
    hook: "A built-in BKB on a short cooldown (Rage, Blade Fury) - control and spell damage bounce off"
    pierced_by: [bkb_piercing_disable]
  - code: magic_resistance
    label: "High innate magic resistance"
    hook: "Innate magic resistance well above the base 25% (Counterspell)"
  - code: physical_damage_block
    label: "Physical attack block"
    hook: "Passively blocks part of every attack (Bulwark from the front, Kraken Shell)"
    pierced_by: [break]
  - code: passive_damage_reduction
    label: "Passive damage reduction"
    hook: "A passive cuts damage of every type (Bristleback from behind, Dispersion, Gravekeeper's Cloak)"
    pierced_by: [break]
  - code: active_damage_reduction
    label: "Active damage reduction"
    hook: "A cast cuts or soaks incoming damage for a window (Enrage, Refraction, Meat Shield)"
  - code: evades_attacks
    label: "Attack evasion"
    hook: "Evasion makes attacks miss (Immaterial, Windrun)"
    pierced_by: [true_strike]
  - code: cheat_death
    label: "Cheat death / save"
    hook: "Survives lethal damage for a window (Borrowed Time, Reincarnation, Shallow Grave, False Promise)"
  - code: spell_block
    label: "Spell block (Linken's)"
    hook: "The first targeted spell is blocked - single-target lockdown and pickoff need a second spell to pop it"
  - code: no_mana_pool
    label: "No mana pool"
    hook: "Spells cost health, not mana (Blood Magic) - mana burn and mana drain have nothing to take"
  - code: self_dispel
    label: "Self strong dispel"
    hook: "Purges own disables on demand (Dark Pact, Aphotic Shield)"

resist_edges:
  # --- Mana Shield ---
  - resistance: mana_shield
    tool: health_based_damage
    weight: 1.0
    mechanism: "Mana Shield pays damage with mana: %-of-health and health-lost damage (Feast, Maledict, Life Break, Scythe) is computed from a small HP pool and barely lands"
  - resistance: mana_shield
    reliance: attack_reliant
    weight: 0.4
    mechanism: "right-click damage drains the mana pool first - a lone hitter needs a long time to reach HP"
  - resistance: mana_shield
    tool: physical_burst
    weight: 0.5
    mechanism: "burst is soaked by the mana pool - one combo rarely kills a full-mana Medusa"
  - resistance: mana_shield
    tool: magic_burst
    weight: 0.5
    mechanism: "nukes are soaked by the mana pool - one combo rarely kills a full-mana Medusa"
  - resistance: mana_shield
    tool: magic_damage
    weight: 0.4
    mechanism: "sustained magic damage is spread over HP + mana"
  # v0.9 (howdoiplay "X does not work against Y", ADR-022)
  - resistance: mana_shield
    tool: armor_reduction
    weight: 0.7
    mechanism: "Mana Shield absorbs damage before armor applies - minus armor (and damage amplification) barely changes how fast she dies"
  - resistance: mana_shield
    reliance: sustain_dependent
    weight: 0.5
    mechanism: "lifesteal is computed from the HP damage dealt, and Mana Shield leaves almost none - lifesteal sustain stops working"
  - resistance: spell_block
    tool: bkb_piercing_disable
    weight: 0.4
    mechanism: "Linken's blocks the targeted ult (Doom, Duel, Fiend's Grip) unless something pops it first"
  - resistance: spell_block
    tool: pickoff
    weight: 0.4
    mechanism: "the targeted pickoff spell is blocked - the gank needs a cheap spell first"
  - resistance: spell_block
    tool: silence
    weight: 0.3
    mechanism: "a targeted silence or hex is blocked by Linken's"
  - resistance: spell_block
    tool: lockdown_root
    weight: 0.3
    mechanism: "a targeted root or stun is blocked by Linken's"
  - resistance: no_mana_pool
    tool: mana_burn
    weight: 1.0
    mechanism: "Blood Magic: spells cost health, so mana burn, Mana Drain and Mind Flare have nothing to take"
  # --- own debuff immunity (Rage, Blade Fury) ---
  - resistance: self_debuff_immunity
    tool: silence
    weight: 0.6
    mechanism: "activates debuff immunity through the silence window or before it lands"
  - resistance: self_debuff_immunity
    tool: lockdown_root
    weight: 0.5
    mechanism: "debuff immunity ignores roots and stuns that don't pierce it"
  - resistance: self_debuff_immunity
    tool: lockdown_early
    weight: 0.4
    mechanism: "early disables are answered by a built-in BKB long before items"
  - resistance: self_debuff_immunity
    tool: magic_burst
    weight: 0.6
    mechanism: "debuff immunity also blocks most magic damage - the nuke combo whiffs"
  - resistance: self_debuff_immunity
    tool: magic_damage
    weight: 0.4
    mechanism: "magic damage over time is blocked during the immunity window"
  # --- innate magic resistance ---
  - resistance: magic_resistance
    tool: magic_burst
    weight: 0.6
    mechanism: "high magic resistance cuts nukes - the burst combo falls short"
  - resistance: magic_resistance
    tool: magic_damage
    weight: 0.6
    mechanism: "high magic resistance cuts sustained magic damage"
  # --- passive damage reduction (all types; Break turns it off) ---
  - resistance: passive_damage_reduction
    tool: physical_burst
    weight: 0.6
    mechanism: "a damage-reduction passive cuts the burst - the combo leaves the target alive"
  - resistance: passive_damage_reduction
    tool: magic_burst
    weight: 0.5
    mechanism: "a damage-reduction passive cuts the nukes - the combo leaves the target alive"
  - resistance: passive_damage_reduction
    reliance: attack_reliant
    weight: 0.4
    mechanism: "every hit is reduced - right-click damage takes far longer to kill"
  - resistance: passive_damage_reduction
    tool: magic_damage
    weight: 0.3
    mechanism: "sustained magic damage is reduced too"
  # --- active damage reduction (Enrage, Refraction, Meat Shield) ---
  - resistance: active_damage_reduction
    tool: physical_burst
    weight: 0.6
    mechanism: "the burst lands into an active damage reduction and falls short"
  - resistance: active_damage_reduction
    tool: magic_burst
    weight: 0.6
    mechanism: "the nukes land into an active damage reduction and fall short"
  - resistance: active_damage_reduction
    tool: pickoff
    weight: 0.5
    mechanism: "the pickoff target answers with an instant damage reduction and survives"
  # --- attack evasion (True Strike / MKB pierces) ---
  - resistance: evades_attacks
    reliance: attack_reliant
    weight: 0.6
    mechanism: "evasion makes a right-click carry miss - until they buy true strike"
  - resistance: evades_attacks
    tool: physical_burst
    weight: 0.4
    mechanism: "attack-based burst misses into evasion"
  # --- physical attack block ---
  - resistance: physical_damage_block
    reliance: attack_reliant
    weight: 0.5
    mechanism: "right-click damage is reduced or reflected - attack carries hit a wall"
  - resistance: physical_damage_block
    tool: physical_burst
    weight: 0.6
    mechanism: "physical burst is reduced or reflected"
  # --- cheat death ---
  - resistance: cheat_death
    tool: pickoff
    weight: 0.6
    mechanism: "the pickoff fails: the target survives the lethal combo"
  - resistance: cheat_death
    tool: physical_burst
    weight: 0.5
    mechanism: "lethal burst is wasted on a save window"
  - resistance: cheat_death
    tool: magic_burst
    weight: 0.5
    mechanism: "lethal burst is wasted on a save window"
  # --- self dispel ---
  - resistance: self_dispel
    tool: silence
    weight: 0.5
    mechanism: "dispellable silences are purged on demand"
  - resistance: self_dispel
    tool: lockdown_root
    weight: 0.5
    mechanism: "roots and dispellable disables are purged on demand"

# -----------------------------------------------------------------------------
#  team_needs - composition (ADR-023): capabilities a lineup wants regardless of
#  the enemy draft. Coverage = sum over allies of tool weight x factor; a candidate
#  that brings a missing capability gets up to `weight` (scaled by the gap and by how
#  much of the draft is known). Weights are expert estimates - modest on purpose, the
#  answer to the ENEMY lineup stays the backbone.
# -----------------------------------------------------------------------------
team_needs:
  - code: disable
    label: "Reliable disable"
    tools: { lockdown_early: 1.0, lockdown_root: 0.8, bkb_piercing_disable: 1.0, interrupt: 0.4, pickoff: 0.3 }
    want: 2.0
    weight: 0.5
  - code: bkb_pierce
    label: "Control through BKB"
    tools: { bkb_piercing_disable: 1.0 }
    want: 0.8
    weight: 0.4
  - code: wave_clear
    label: "Wave clear / AoE"
    tools: { aoe_clear: 1.0, magic_burst: 0.3, magic_damage: 0.3 }
    want: 1.0
    weight: 0.35
  - code: save
    label: "Save for allies"
    tools: { ally_save: 1.0 }
    want: 0.6
    weight: 0.35
  - code: dispel_enemy
    label: "Purge enemy buffs"
    tools: { purge: 1.0, break: 0.3 }
    want: 0.5
    weight: 0.2

