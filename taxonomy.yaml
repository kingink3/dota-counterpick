  - code: physical_burst
    class: mechanical
    label: "Physical burst"
    sources_hint: ["Sven", "PA", "Troll", "Ursa"]
  - code: bkb_piercing_disable
    class: mechanical
    label: "BKB-piercing disable"
    sources_hint: ["Doom", "Primal Roar(Beastmaster)", "Chronosphere", "Black Hole", "Global Silence", "Fiend's Grip", "Duel", "Naga(Song)"]
  - code: lockdown_root
    class: mechanical
    label: "Root/leash vs mobility"
    sources_hint: ["Naga(Ensnare)", "Batrider(Lasso)", "Treant", "Hoodwink", "Shadow Shaman(Shackles)"]
  - code: magic_burst
    class: mechanical
    label: "Magic burst combo"
    sources_hint: ["Lina", "Lion", "Zeus", "Tinker", "Skywrath"]
  - code: magic_damage
    class: mechanical
    label: "Magic damage (ignores armor)"
    sources_hint: ["Revenant's Brooch", "Veil of Discord", "Dagon", "Ethereal Blade"]
  - code: silence
    class: mechanical
    label: "Silence"
    sources_hint: ["Silencer(Global)", "Drow", "Night Stalker", "Orchid", "Disruptor(Glimpse-tempo)"]
  - code: lockdown_early
    class: strategic
    label: "Early lane control/ganks"
  - code: early_pressure
    class: strategic
    label: "Early map pressure"
  - code: pickoff
    class: strategic
    label: "Single-target pickoff"
  - code: out_scales
    class: strategic
    label: "Out-scales late"
  - code: disarm
    class: mechanical
    label: "Disarm / attack denial"
    sources_hint: ["Heaven's Halberd", "Bane(Nightmare)", "Snapfire(?)", "Hoodwink(?)"]
  - code: kite
