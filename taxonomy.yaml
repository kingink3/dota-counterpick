# =============================================================================
#  Dota Counter-Pick Knowledge Base - Taxonomy (source of truth, versioned)
# =============================================================================
#  Structure:
#    reliance[]    - what the target can be grabbed by (target-side)
#    tool[]        - what negates it (subject-side: a hero OR an item)
#    special_cases - traps where the naive taxonomy lies (see the guards)
#    edges[]       - canonical tool->reliance rules (the rule base)
#    hero_tags[]   - membership: which reliance/tool a hero carries, with weight
#
#  IMPORTANT (honest confidence flag):
#  The membership below reflects knowledge as of the ~early-2026 patch. Hero
#  reworks and new heroes after that point are NOT accounted for. Re-check
#  against the live patch before prod, especially recently reworked heroes. This
#  is domain assertion, not computed data - treat it as an expert draft.
#
#  Tag validity criterion (granularity test):
#    a tag is valid IF a tool exists that reliably beats EVERY carrier of the
#    tag. Works on only some carriers -> split the tag / lower the weight /
#    attach a condition guard.
# =============================================================================

meta:
  schema_version: 0.1
  # patch the KB was reviewed against (patch:check compares this with dotaconstants)
  patch: "7.41"
  reviewed: "2026-11-03: full pass on supports/flex (v0.6); cores carried over from the early-2026 draft"
  weight_semantics: >
    Membership is almost binary. weight (0.0-1.0) encodes how CENTRAL the tag is
    to the hero: 1.0 = the hero's whole identity rests on it, 0.5 = one of several
    tools. The engine multiplies by weight when scoring.

# -----------------------------------------------------------------------------
#  RELIANCE / VULNERABILITY  (target-side - what we grab onto)
# -----------------------------------------------------------------------------
reliance:
  - code: mana_dependent
    label: "Mana-dependent"
    hook: "Abilities/shields break when mana is emptied"
    answered_by: [mana_burn]

  - code: relies_on_invisibility
    label: "Relies on invisibility"
    hook: "Invis is the key to initiation or escape"
    answered_by: [detection]

  - code: illusion_based
    label: "Illusion-based"
    hook: "Illusions are cleared by AoE; the real hero is exposed"
    answered_by: [aoe_clear, illusion_detection]

  - code: summon_clearable          # see special_cases: NOT all summons
    label: "Relies on fragile summons"
    hook: "Eidolons/treants/spiderlings/familiars die to AoE"
    answered_by: [aoe_clear]

  - code: evasion                   # see special_cases: backtrack != evasion
    label: "Evasion (miss chance)"
    hook: "Physical damage misses while evasion is up"
    answered_by: [true_strike, break]

  - code: channeling_ultimate
    label: "Channeled ultimate/ability"
    hook: "The effect is cancelled by an interrupt before it lands"
    answered_by: [interrupt, bkb_piercing_disable]

  - code: sustain_dependent
    label: "Sustain/lifesteal-dependent"
    hook: "Cutting healing collapses survivability"
    answered_by: [healing_reduction]

  - code: low_armor
    label: "Low armor"
    hook: "Minus armor multiplies physical damage on the target"
    answered_by: [armor_reduction, physical_burst]

  - code: high_armor
    label: "High armor / physical-resistant"
    hook: "Physical is mitigated - bring magic damage (ignores armor) or shred the armor"
    answered_by: [magic_damage, magic_burst, armor_reduction]

  - code: magic_burst_vulnerable
    label: "Fragile to magic burst"
    hook: "Low HP/MR with no escape - dies to the combo before acting"
    answered_by: [magic_burst]

  - code: mobility_dependent
    label: "Mobility/blink-escape dependent"
    hook: "Root/leash cancels the escape; a BKB-piercing lock catches it even under immunity"
    answered_by: [lockdown_root, bkb_piercing_disable]

  - code: snowball_dependent
    label: "Snowball / weak late"
    hook: "Needs early kills; a stalled tempo = losing on scaling"
    answered_by: [lockdown_early, out_scales]     # strategic answer

  - code: greedy_farmer
    label: "Greedy farmer / late hypercarry"
    hook: "Needs time/space; vulnerable to early pressure and pickoffs"
    answered_by: [early_pressure, pickoff]        # strategic answer

  - code: spell_reliant
    label: "Relies on active casts"
    hook: "Silence shuts the hero off as a fighting unit"
    answered_by: [silence, bkb_piercing_disable]

  # --- axes forced by expanding to cores ---
  - code: attack_reliant
    label: "Auto-attack reliant (right-clicker)"
    hook: "Disarm/blind/evasion cancel the DPS; a steroid passive can be broken"
    answered_by: [disarm, evasion, break]

  - code: melee_commit
    label: "Melee carry, must enter attack range"
    hook: "Kite/control deny the damage; vulnerable on the dive"
    answered_by: [kite, lockdown_root, bkb_piercing_disable]

  - code: low_mobility
    label: "No escape/blink"
    hook: "Gets pinned and focused; a slow hero is kited"
    answered_by: [pickoff, kite, lockdown_early]

  - code: squishy_to_burst
    label: "Low effective HP (any damage)"
    hook: "Dies to focus before doing its job, physical OR magical"
    answered_by: [magic_burst, physical_burst, pickoff]

  - code: summon_tanky
    label: "Relies on TANKY summons (not AoE-cleared)"
    hook: "Bear/Golem have real HP - hit the owner / focus-fire the unit"
    answered_by: [break, lockdown_root, focus_summon]   # NOT aoe_clear

  - code: dodge_backtrack
    label: "Backtrack dodge (NOT evasion)"
    hook: "true_strike does NOT pierce; needs a passive break / control / burst"
    answered_by: [break, bkb_piercing_disable, magic_burst, silence]   # NOT true_strike

  - code: key_passive
    label: "Relies on a key passive"
    hook: "A defining passive (Reactive Armor/Warpath/Dispersion) - break turns the hero off"
    answered_by: [break]

  - code: dispellable_buffs
    label: "Relies on dispellable buffs"
    hook: "Key buffs can be purged off (Ion Shell, Flame Guard, Windrun, Overpower, Ghost Shroud)"
    answered_by: [purge]

  - code: pickoff_reliant
    label: "Wins by killing one target fast"
    hook: "The kit is built to delete one hero in a short window (Duel, Scythe, Battle Trance) - a save wastes it"
    answered_by: [ally_save]

  - code: bkb_reliant
    label: "[FLAG] Regularly buys BKB"
    hook: "Used ONLY in rule guards, never as a recommendation target"
    answered_by: [bkb_piercing_disable]

# -----------------------------------------------------------------------------
#  TOOL  (subject-side - what we hit with). mechanical = resolved by item/skill.
#         strategic = a draft/composition property, not a point tool.
# -----------------------------------------------------------------------------
